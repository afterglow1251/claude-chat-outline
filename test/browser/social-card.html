<!doctype html>
<!-- 1280x640 social preview (GitHub / link cards). Rendered by test/browser/screenshots.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: #faf9f5; color: #2d2b26; font-family: system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 520px 1fr; align-items: center; }
  .text { padding: 0 40px 0 72px; }
  .icon { width: 88px; height: 88px; }
  h1 { font-size: 56px; line-height: 1.05; margin: 18px 0 16px; letter-spacing: -0.5px; }
  p { font-size: 26px; line-height: 1.35; color: #5b5a54; margin: 0 0 26px; }
  .tag { display: inline-block; font-size: 20px; font-weight: 600; color: #fff; background: #c4613f;
    padding: 8px 16px; border-radius: 10px; }
  .shot { height: 640px; overflow: hidden; position: relative; }
  .shot img { position: absolute; top: 56px; right: -8px; width: 1140px; border-radius: 14px 0 0 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 1px solid rgba(0,0,0,0.08); }
</style>
</head>
<body>
  <div class="text">
    <img class="icon" src="/icons/icon128.png" alt="">
    <h1>Claude Chat Outline</h1>
    <p>A table of contents for your Claude.ai chats. Jump to any question in one click.</p>
    <span class="tag">Free Chrome extension</span>
  </div>
  <div class="shot"><img src="/docs/screenshot-light.png" alt=""></div>
</body>
</html>
