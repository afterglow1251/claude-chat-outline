<!doctype html>
<!--
  Standalone reproduction of claude.ai's chat DOM (as described in the task).
  Serve with:  python3 test/serve.py   then open http://localhost:8765/chat/aaaaaaaa-0000-4000-8000-000000000001
  Query params:
    ?variant=testid   (default) user turns expose data-testid + .font-user-message + "You said:" heading
    ?variant=heading  only the "You said:" heading (exercises fallback strategy 2)
    ?variant=broken   no recognisable hooks (exercises the "selectors outdated" state)
    ?selftest=1       run test/selftest.js and print results
    ?virtual=1        virtualize like claude.ai: turns more than one screen away
                      from the viewport are replaced by same-height placeholders
    ?nonum=1          article aria-labels without numbers ("Message" instead of
                      "Message N of M")
    ?estimate=1       with ?virtual=1: turns never rendered get an estimated
                      height (like tanstack/react-virtual), so the feed height
                      and positions shift as you scroll
    ?cds=1            claude.ai's current markup: [data-testid=transcript-row] >
                      div[role=article][aria-posinset], and question 3 of chat A
                      is a code block + text (stored with a ``` fence)
    ?demo=1           realistic demo chat for README screenshots (test/screenshots.py);
                      add &dark=1 for dark mode
    ?api=1            serve claude.ai's conversation API from the fixture data
                      (all questions, including ones not loaded in the page)
    ?intercept=1      the app loads the conversation itself and the extension's
                      own API request fails: the list must come from the
                      response the app receives (page-bridge.js)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Outline fixture</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #faf9f5; color: #3d3929; }
    html.dark body { background: #262624; color: #ece9e1; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar { height: 56px; flex: none; display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid #0002; }
    .scroller { flex: 1; overflow-y: auto; overflow-anchor: none; }
    [role="feed"] { max-width: 720px; margin: 0 auto; padding: 16px; }
    article { padding: 12px 16px; margin: 12px 0; border-radius: 10px; }
    article.user { background: #0000000d; }
    article.assistant p { margin: 0 0 1em; }
    .placeholder { margin: 12px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #results { position: fixed; left: 8px; bottom: 8px; max-width: 50vw; max-height: 40vh; overflow: auto; background: #fff; color: #000; border: 1px solid #ccc; padding: 8px; font: 12px monospace; z-index: 10; }
  </style>
  <script>
    // Extension warnings are swallowed on purpose (a broken selector must not
    // break the page), so the self-test collects them from here.
    window.consoleWarnings = [];
    for (const level of ['warn', 'error']) {
      const original = console[level].bind(console);
      console[level] = (...args) => {
        window.consoleWarnings.push(args.map((a) => (a && a.stack) || String(a)).join(' '));
        original(...args);
      };
    }
    // Stand-in for the extension APIs the content scripts use.
    window.chrome = {
      runtime: { lastError: undefined, getURL: (p) => '/dist/' + p },
      storage: {
        local: {
          get(keys, cb) {
            const saved = JSON.parse(localStorage.getItem('co-store') || '{}');
            let out;
            if (keys == null) out = saved;
            else if (typeof keys === 'string') out = keys in saved ? { [keys]: saved[keys] } : {};
            else out = { ...keys, ...Object.fromEntries(Object.keys(keys).filter((k) => k in saved).map((k) => [k, saved[k]])) };
            setTimeout(() => cb(out), 0);
          },
          set(patch) {
            const saved = JSON.parse(localStorage.getItem('co-store') || '{}');
            localStorage.setItem('co-store', JSON.stringify({ ...saved, ...patch }));
          },
          remove(keys) {
            const saved = JSON.parse(localStorage.getItem('co-store') || '{}');
            for (const k of [].concat(keys)) delete saved[k];
            localStorage.setItem('co-store', JSON.stringify(saved));
          },
        },
      },
    };
  </script>
  <script>
    // ---- Fake claude.ai server (?api=1, ?intercept=1) --------------------
    // Installed before page-bridge.js, as claude.ai's real network is.
    // GET /api/organizations/<org>/chat_conversations/<id> returns every
    // message of the chat (also ones not loaded in the page) as a tree with
    // an abandoned branch (an edited first question) that must not appear.
    //  ?api=1        the extension's own request works (org from the cookie).
    //  ?intercept=1  only the app's own request works (another org, no
    //                cookie, /api/organizations fails): the outline can only
    //                get the list from the response the app receives.
    window.apiCalls = 0;
    (() => {
      const p = new URLSearchParams(location.search);
      const API = p.has('api');
      const INTERCEPT = p.has('intercept');
      if (!API && !INTERCEPT) return;
      const ORG = API ? 'org-1' : 'org-app';
      if (API) document.cookie = 'lastActiveOrg=org-1; path=/';
      const realFetch = window.fetch.bind(window);
      const json = (data) => new Response(JSON.stringify(data), { headers: { 'content-type': 'application/json' } });
      const conversation = (chat) => {
        const messages = [];
        let parent = '00000000-0000-4000-8000-000000000000';
        chat.questions.forEach((q, i) => {
          if (i === 0) {
            messages.push({ uuid: 'old-edit', parent_message_uuid: parent, sender: 'human', index: 0, content: [{ type: 'text', text: 'An old version of the first question' }] });
          }
          const h = { uuid: `h${i}`, parent_message_uuid: parent, sender: 'human', index: 2 * i, content: q ? [{ type: 'text', text: q }, { type: 'tool_use' }] : [], text: q };
          const a = { uuid: `a${i}`, parent_message_uuid: h.uuid, sender: 'assistant', index: 2 * i + 1, content: [{ type: 'text', text: 'answer' }] };
          messages.push(h, a);
          parent = a.uuid;
        });
        return { uuid: 'x', chat_messages: messages, current_leaf_message_uuid: parent };
      };
      window.fetch = async (url, opts) => {
        const u = new URL(url instanceof Request ? url.url : url, location.href);
        if (u.pathname === '/api/organizations') return API ? json([{ uuid: ORG }]) : new Response('', { status: 404 });
        const m = u.pathname.match(/^\/api\/organizations\/([\w-]+)\/chat_conversations\/([\w-]+)$/);
        if (m) {
          if (m[1] !== ORG) return new Response('', { status: 404 });
          window.apiCalls++;
          const chat = CHATS[m[2]];
          await new Promise((r) => setTimeout(r, 100));
          return chat ? json(conversation(chat)) : new Response('', { status: 404 });
        }
        return realFetch(url, opts);
      };
      // Like claude.ai: the app loads the conversation it shows.
      window.appLoadConversation = () => {
        const id = location.pathname.match(/^\/chat\/([\w-]+)/)?.[1];
        if (INTERCEPT && id) {
          fetch(`/api/organizations/${ORG}/chat_conversations/${id}?tree=True&rendering_mode=messages`)
            .then((r) => r.json())
            .catch(() => {});
        }
      };
    })();
  </script>
  <!-- In the real extension this runs in the page ("MAIN") world. -->
  <script src="/dist/page-bridge.js"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button data-nav="/chat/aaaaaaaa-0000-4000-8000-000000000001">Chat A</button>
      <button data-nav="/chat/bbbbbbbb-0000-4000-8000-000000000002">Chat B</button>
      <button data-nav="/new">/new</button>
      <button id="stream">Simulate streaming turn</button>
      <button id="replace">Replace feed node</button>
      <button id="theme">Toggle dark</button>
    </div>
    <div class="scroller" id="scroller"></div>
  </div>

  <script>
    // ---- Fake Claude app -------------------------------------------------
    const params = new URLSearchParams(location.search);
    const VARIANT = params.get('variant') || 'testid';
    const VIRTUAL = params.has('virtual');
    const ESTIMATE = params.has('estimate');
    const CDS = params.has('cds');
    const CODE_QUESTION = '```notebook-python\nmu, sigma = X.mean(0), X.std(0)\nXn = (X - mu) / sigma\n```\nwhat is mu and what is sigma';
    const ESTIMATED_HEIGHT = 300;
    const NONUM = params.has('nonum');
    // ?wheelload=1: today's claude.ai. Turns are numbered within what is
    // loaded (renumbered on every load), the "Load earlier messages" button
    // only scrolls to the first loaded turn, and earlier messages are
    // fetched only on a wheel scroll up at the top of the chat.
    const WHEELLOAD = params.has('wheelload');
    const WHEEL_BATCH = 2; // turns per load
    const turnLabel = (n, m) => (NONUM ? 'Message' : `Message ${n} of ${m}`);
    const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ';

    function makeQuestions(prefix, n) {
      const qs = [];
      for (let i = 1; i <= n; i++) {
        if (i === 4) qs.push(''); // attachment-only message
        else if (i === 3 && CDS && prefix === 'Alpha') qs.push(CODE_QUESTION);
        else if (i === 7) qs.push(`${prefix} question ${i}: ` + 'a very long question that keeps going '.repeat(5));
        else qs.push(`${prefix} question ${i}:   how do I   handle case #${i}?`);
      }
      return qs;
    }

    const CHATS = {
      'aaaaaaaa-0000-4000-8000-000000000001': { questions: makeQuestions('Alpha', 9), shownTurns: WHEELLOAD ? 4 : 12 },
      'bbbbbbbb-0000-4000-8000-000000000002': { questions: makeQuestions('Beta', 12), shownTurns: 8 },
    };

    // ---- Demo chat for README screenshots (?demo=1) ---------------------
    const DEMO = params.has('demo');
    const DEMO_CHAT = [
      ['Explain the difference between TCP and UDP like I am a backend engineer', 'TCP gives you an ordered, reliable byte stream: every segment is acknowledged, lost packets are retransmitted, and congestion control slows the sender down when the network is busy. UDP gives you individual datagrams with none of that. That makes UDP a good fit when late data is useless anyway, such as voice, games and DNS lookups, and TCP the default for everything that must arrive intact.'],
      ['Write a Python function that retries failed HTTP requests with exponential backoff', 'Here is a small helper built on requests. It retries on connection errors and 5xx responses, doubles the wait after every attempt, adds jitter so many clients do not retry in lockstep, and gives up after a configurable number of attempts. The final exception is re-raised so callers still see what went wrong.'],
      ['Why does my React component render twice in development?', 'That is React Strict Mode. In development it intentionally mounts, unmounts and re-mounts components, and calls render functions twice, to surface side effects that are not idempotent. It does not happen in a production build. If an effect breaks when it runs twice, it usually needs a cleanup function.'],
      ['What index would speed up this PostgreSQL query on orders by customer and date?', 'A composite B-tree index on (customer_id, created_at DESC) matches both the filter and the sort, so Postgres can read the newest rows for one customer directly from the index. Put the equality column first and the range or sort column second. Check the plan with EXPLAIN ANALYZE before and after.'],
      ['Rewrite the retry helper with asyncio and httpx', 'The async version keeps the same policy: the same attempts, backoff and jitter, with asyncio.sleep instead of time.sleep and an httpx.AsyncClient shared across calls. Sharing the client matters, because it reuses connections instead of opening a new one per request.'],
      ['How should I structure logging in a FastAPI app?', 'Configure logging once at startup, emit structured JSON in production, and attach a request id to every log line with a small middleware. Keep application loggers named per module, and send uvicorn access logs through the same handler so everything ends up in one consistent format.'],
      ['Redis or Memcached for session storage?', 'Redis, in most cases. Both are fast in-memory stores, but Redis adds persistence, replication, per-key expiry and richer data types, which you will want once sessions hold more than a token. Memcached is simpler and scales out easily when you only need a volatile cache.'],
      ['Write pytest tests for the backoff function', 'The tests below freeze time with a fake sleep, so they run instantly. They check that the delays double, that jitter stays within bounds, that the function stops after the maximum number of attempts, and that a success on the third try returns the response without further retries.'],
      ['What do mu and sigma mean when normalizing features?', 'mu is the mean of each feature column and sigma is its standard deviation. Subtracting mu centres every feature at zero and dividing by sigma scales it to unit variance, so features measured in very different units contribute comparably to the model. Compute both on the training set only.'],
      ['Summarize the trade-offs we discussed so far', 'Reliability versus latency for the transport, simplicity versus features for the cache, and sync versus async for the HTTP client. In each case the simpler option is fine until you need what the other one adds, and the decision is cheap to revisit later.'],
      ['Draft a short README section for the retry helper', 'Retry helper: retries failed HTTP requests with exponential backoff and jitter. It retries on connection errors and 5xx responses, waits 0.5 s, 1 s, 2 s and so on between attempts, and re-raises the last error after the final attempt. Works with both requests and httpx.'],
      ['What would you change before shipping this to production?', 'Add metrics for retry counts, cap the total time spent retrying, make the retryable status codes configurable, and make sure non-idempotent requests such as POST are never retried without an idempotency key. Then load-test the failure path, not just the happy path.'],
    ];
    if (DEMO) {
      document.querySelector('.topbar').hidden = true;
      if (params.has('dark')) document.documentElement.classList.add('dark');
      const style = document.createElement('style');
      style.textContent = `
        .topbar[hidden] { display: none; }
        body { font: 16px/1.6 ui-serif, Georgia, serif; }
        [role="feed"] { max-width: 760px; padding: 24px 32px 120px; margin: 0 auto 0 calc(50% - 560px); }
        article.user { background: #f0eee6; margin-left: auto; width: fit-content; max-width: 75%; font-family: system-ui, sans-serif; font-size: 15px; border-radius: 16px; }
        article.user button { display: none; }
        html.dark article.user { background: #141413; }
        article.assistant { padding-left: 0; }
        .demo-header { height: 56px; display: flex; align-items: center; padding: 0 20px; font: 600 15px system-ui, sans-serif; border-bottom: 1px solid #0001; }
        html.dark .demo-header { border-color: #fff1; }`;
      document.head.append(style);
      const header = document.createElement('div');
      header.className = 'demo-header';
      header.textContent = 'Backend questions';
      document.querySelector('.app').prepend(header);
      const chat = CHATS['aaaaaaaa-0000-4000-8000-000000000001'];
      chat.questions = DEMO_CHAT.map(([q]) => q);
      chat.shownTurns = DEMO_CHAT.length * 2;
      chat.answers = DEMO_CHAT.map(([, a]) => a);
    }

    function turnsOf(chat) {
      chat.turnCache = chat.turnCache || [];
      return chat.questions.flatMap((q, i) => {
        if (!chat.turnCache[i] || chat.turnCache[i][0].text !== q) {
          const answer = chat.answers ? chat.answers[i] : LOREM.repeat(4 + (i % 5) * 3);
          chat.turnCache[i] = [{ role: 'user', text: q }, { role: 'assistant', text: answer }];
        }
        return chat.turnCache[i];
      });
    }

    // claude.ai's current markup: a row wrapper around a div[role=article].
    function cdsTurn(a, n, m) {
      const div = document.createElement('div');
      div.className = a.className;
      div.setAttribute('role', 'article');
      div.setAttribute('aria-label', a.getAttribute('aria-label'));
      div.setAttribute('aria-posinset', String(n));
      div.setAttribute('aria-setsize', String(m));
      div.append(...a.childNodes);
      const row = document.createElement('div');
      row.setAttribute('data-testid', 'transcript-row');
      row.setAttribute('data-index', String(n - 1));
      row.append(div);
      return row;
    }

    // A message like "```lang\ncode\n```\ntext" renders as <pre><code> + <p>,
    // and its "You said:" heading only carries the text part.
    function renderBody(body, text) {
      const m = /^```[^\n]*\n([\s\S]*?)\n```\n?([\s\S]*)$/.exec(text);
      if (!m) return (body.textContent = text), text;
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = m[1];
      pre.append(code);
      const p = document.createElement('p');
      p.textContent = m[2];
      body.append(pre, p);
      return m[2];
    }

    function userArticle(text, n, m) {
      const a = document.createElement('article');
      a.className = 'user';
      a.setAttribute('aria-label', turnLabel(n, m));
      const h = document.createElement('h2');
      h.className = 'sr-only';
      const body = document.createElement('div');
      if (VARIANT === 'testid') {
        body.setAttribute('data-testid', 'user-message');
        body.className = 'font-user-message';
      }
      const said = renderBody(body, text);
      h.textContent = VARIANT === 'broken' ? 'Human message' : `You said: ${said}`;
      if (!text) body.append(Object.assign(document.createElement('img'), { alt: '', width: 40, height: 40 }));
      const actions = document.createElement('button');
      actions.textContent = 'Edit';
      a.append(h, body, actions);
      return a;
    }

    function assistantArticle(text, n, m) {
      const a = document.createElement('article');
      a.className = 'assistant';
      a.setAttribute('aria-label', turnLabel(n, m));
      const h = document.createElement('h2');
      h.className = 'sr-only';
      h.textContent = 'Claude responded:';
      const p = document.createElement('p');
      p.textContent = text;
      a.append(h, p);
      return a;
    }

    let feed = null;
    let loading = false;

    function currentChat() {
      const m = location.pathname.match(/^\/chat\/([\w-]+)/);
      return m ? CHATS[m[1]] : null;
    }

    function newFeed() {
      const f = document.createElement('div');
      f.setAttribute('role', 'feed');
      f.setAttribute('aria-label', 'Chat messages');
      return f;
    }

    function turnNode(t, n, m) {
      let node = t.role === 'user' ? userArticle(t.text, n, m) : assistantArticle(t.text, n, m);
      if (CDS) node = cdsTurn(node, n, m);
      node._turn = { t, n, m };
      return node;
    }

    // Virtualization, as claude.ai does it: turns further than one screen
    // from the viewport are unmounted and replaced by a placeholder of the
    // same height; scrolling back re-creates them as NEW nodes (like React).
    function virtualize() {
      if (!VIRTUAL || !feed || !feed.isConnected) return;
      const sc = document.getElementById('scroller');
      const box = sc.getBoundingClientRect();
      const keepTop = box.top - sc.clientHeight;
      const keepBottom = box.bottom + sc.clientHeight;
      for (const el of Array.from(feed.children)) {
        if (!el._turn) continue;
        const r = el.getBoundingClientRect();
        const near = r.bottom >= keepTop && r.top <= keepBottom;
        const isPlaceholder = el.classList.contains('placeholder');
        if (!isPlaceholder && !near) {
          el._turn.t.measured = r.height;
          el.replaceWith(placeholder(el._turn));
        } else if (isPlaceholder && near) {
          el.replaceWith(turnNode(el._turn.t, el._turn.n, el._turn.m));
        }
      }
    }
    function placeholder(turn) {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.style.height = (turn.t.measured || ESTIMATED_HEIGHT) + 'px';
      ph._turn = turn;
      return ph;
    }
    let virtualFrame = 0;
    function scheduleVirtualize() {
      if (!VIRTUAL || virtualFrame) return;
      virtualFrame = requestAnimationFrame(() => { virtualFrame = 0; virtualize(); });
    }

    function loadButton() {
      const btn = document.createElement('button');
      btn.textContent = 'Load earlier messages';
      // claude.ai: a screen-reader button that only scrolls to the first
      // loaded turn; the fetch happens on a wheel scroll up at the top.
      btn.onclick = WHEELLOAD ? () => { document.getElementById('scroller').scrollTop = 0; } : loadEarlier;
      return btn;
    }

    // Page numbering of a turn: its place in the whole conversation, or
    // (WHEELLOAD) among the loaded turns only.
    function pageNumbers(chat, absoluteIndex) {
      const turns = turnsOf(chat);
      const start = turns.length - chat.shownTurns;
      return WHEELLOAD ? [absoluteIndex - start + 1, chat.shownTurns] : [absoluteIndex + 1, turns.length];
    }

    // After a load (WHEELLOAD) every turn gets its new number, as claude.ai
    // renumbers the whole loaded set.
    function renumber(chat) {
      if (!feed) return;
      const turns = turnsOf(chat);
      for (const el of feed.children) {
        if (!el._turn) continue;
        const [n, m] = pageNumbers(chat, turns.indexOf(el._turn.t));
        el._turn.n = n;
        el._turn.m = m;
        const target = el.matches('[role="article"], article') ? el : el.querySelector('[role="article"], article');
        if (!target) continue;
        target.setAttribute('aria-label', turnLabel(n, m));
        if (target.hasAttribute('aria-posinset')) {
          target.setAttribute('aria-posinset', String(n));
          target.setAttribute('aria-setsize', String(m));
        }
      }
    }

    // WHEELLOAD: a wheel scroll up at the top fetches earlier messages,
    // keeping the view where it was (claude.ai anchors the scroll).
    function wheelLoad(e) {
      if (!WHEELLOAD || e.deltaY >= 0 || loading) return;
      const scroller = document.getElementById('scroller');
      if (scroller.scrollTop > 1) return;
      const chat = currentChat();
      const turns = turnsOf(chat);
      if (chat.shownTurns >= turns.length) return;
      loading = true;
      window.wheelLoads = (window.wheelLoads || 0) + 1;
      setTimeout(() => {
        loading = false;
        const anchor = feed.querySelector('[role="article"], article, .placeholder');
        const anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
        const oldStart = turns.length - chat.shownTurns;
        chat.shownTurns = Math.min(turns.length, chat.shownTurns + WHEEL_BATCH);
        const start = turns.length - chat.shownTurns;
        const nodes = turns.slice(start, oldStart).map((t, i) => {
          const [n, m] = pageNumbers(chat, start + i);
          return VIRTUAL && ESTIMATE ? placeholder({ t, n, m }) : turnNode(t, n, m);
        });
        const btn = feed.querySelector(':scope > button');
        if (btn) btn.after(...nodes);
        else feed.prepend(...nodes);
        if (start === 0 && btn) btn.remove();
        renumber(chat);
        if (anchor) scroller.scrollTop += anchor.getBoundingClientRect().top - anchorTop;
        virtualize();
      }, 300);
    }

    // Full render, only on navigation (a new conversation).
    function renderFeed() {
      if (window.appLoadConversation) window.appLoadConversation();
      const chat = currentChat();
      const scroller = document.getElementById('scroller');
      if (!chat) { scroller.replaceChildren(); feed = null; return; }
      // A navigation remounts the chat, so the feed is a new node.
      feed = newFeed();
      scroller.replaceChildren(feed);
      const turns = turnsOf(chat);
      const start = turns.length - chat.shownTurns;
      const nodes = turns.slice(start).map((t, i) => {
        const [n, m] = pageNumbers(chat, start + i);
        const turn = { t, n, m };
        // Estimated heights: only the last few turns start rendered.
        return VIRTUAL && ESTIMATE && start + i < turns.length - 4 ? placeholder(turn) : turnNode(t, turn.n, turn.m);
      });
      feed.replaceChildren(...(start > 0 ? [loadButton()] : []), ...nodes);
      // Start scrolled to the bottom, like a real chat.
      scroller.scrollTop = scroller.scrollHeight;
      virtualize();
    }

    // Each click injects 3 more turns above the existing ones after a fake
    // network delay, keeping existing nodes (as React would). The scroller has
    // overflow-anchor: none, so the view jumps unless the extension restores it.
    function loadEarlier(e) {
      if (loading) return;
      loading = true;
      const btn = e.currentTarget;
      btn.textContent = 'Loading…';
      const chat = currentChat();
      setTimeout(() => {
        loading = false;
        const turns = turnsOf(chat);
        const oldStart = turns.length - chat.shownTurns;
        chat.shownTurns = Math.min(turns.length, chat.shownTurns + 3);
        const start = turns.length - chat.shownTurns;
        const nodes = turns.slice(start, oldStart).map((t, i) =>
          VIRTUAL && ESTIMATE ? placeholder({ t, n: start + i + 1, m: turns.length }) : turnNode(t, start + i + 1, turns.length)
        );
        btn.after(...nodes);
        if (start > 0) btn.textContent = 'Load earlier messages';
        else btn.remove();
        virtualize();
      }, 250);
    }

    function navigate(path) {
      history.pushState({}, '', path + location.search);
      renderFeed();
    }

    // Appends a user turn, then grows an assistant turn every 20ms for 3s.
    function stream(question = 'Streaming question about observers') {
      const chat = currentChat();
      chat.questions.push(question);
      chat.shownTurns += 2;
      const m = chat.questions.length * 2;
      feed.append(turnNode({ role: 'user', text: question }, m - 1, m));
      const answer = turnNode({ role: 'assistant', text: '' }, m, m);
      feed.append(answer);
      virtualize();
      const p = answer.querySelector('p');
      const started = performance.now();
      return new Promise((resolve) => {
        const tick = setInterval(() => {
          const span = document.createElement('span');
          span.textContent = 'token ';
          p.append(span);
          if (performance.now() - started > 3000) { clearInterval(tick); resolve(); }
        }, 20);
      });
    }

    function replaceFeed() {
      const old = feed;
      feed = newFeed();
      feed.append(...old.childNodes);
      old.replaceWith(feed);
    }

    document.querySelectorAll('[data-nav]').forEach((b) => (b.onclick = () => navigate(b.dataset.nav)));
    document.getElementById('stream').onclick = () => stream();
    document.getElementById('replace').onclick = replaceFeed;
    document.getElementById('theme').onclick = () => document.documentElement.classList.toggle('dark');
    window.addEventListener('popstate', renderFeed);
    document.getElementById('scroller').addEventListener('scroll', scheduleVirtualize, { passive: true });
    document.getElementById('scroller').addEventListener('wheel', wheelLoad, { passive: true });
    renderFeed();
    if (DEMO) {
      // Put the 7th question at the top, so a question mid-list is highlighted.
      setTimeout(() => {
        const sc = document.getElementById('scroller');
        const q7 = document.querySelectorAll('article.user')[6];
        sc.scrollTop += q7.getBoundingClientRect().top - sc.getBoundingClientRect().top - 80;
      }, 400);
    }

    window.fixture = { CHATS, navigate, stream, replaceFeed, get feed() { return feed; } };
  </script>

  <script src="/dist/content.js"></script>
  <script>
    if (params.has('selftest')) {
      const s = document.createElement('script');
      s.src = '/test/selftest.js';
      document.body.append(s);
    }
  </script>
</body>
