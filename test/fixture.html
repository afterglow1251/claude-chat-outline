<!doctype html>
<!--
  Standalone reproduction of claude.ai's chat DOM (as described in the task).
  Serve with:  python3 test/serve.py   then open http://localhost:8765/chat/aaaaaaaa-0000-4000-8000-000000000001
  Query params:
    ?variant=testid   (default) user turns expose data-testid + .font-user-message + "You said:" heading
    ?variant=heading  only the "You said:" heading (exercises fallback strategy 2)
    ?variant=broken   no recognisable hooks (exercises the "selectors outdated" state)
    ?selftest=1       run test/selftest.js and print results
    ?virtual=1        virtualize like claude.ai: turns more than one screen away
                      from the viewport are replaced by same-height placeholders
    ?nonum=1          article aria-labels without numbers ("Message" instead of
                      "Message N of M")
    ?estimate=1       with ?virtual=1: turns never rendered get an estimated
                      height (like tanstack/react-virtual), so the feed height
                      and positions shift as you scroll
    ?cds=1            claude.ai's current markup: [data-testid=transcript-row] >
                      div[role=article][aria-posinset], and question 3 of chat A
                      is a code block + text (stored with a ``` fence)
    ?api=1            serve claude.ai's conversation API from the fixture data
                      (all questions, including ones not loaded in the page)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Outline fixture</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #faf9f5; color: #3d3929; }
    html.dark body { background: #262624; color: #ece9e1; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar { height: 56px; flex: none; display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid #0002; }
    .scroller { flex: 1; overflow-y: auto; overflow-anchor: none; }
    [role="feed"] { max-width: 720px; margin: 0 auto; padding: 16px; }
    article { padding: 12px 16px; margin: 12px 0; border-radius: 10px; }
    article.user { background: #0000000d; }
    article.assistant p { margin: 0 0 1em; }
    .placeholder { margin: 12px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #results { position: fixed; left: 8px; bottom: 8px; max-width: 50vw; max-height: 40vh; overflow: auto; background: #fff; color: #000; border: 1px solid #ccc; padding: 8px; font: 12px monospace; z-index: 10; }
  </style>
  <script>
    // Extension warnings are swallowed on purpose (a broken selector must not
    // break the page), so the self-test collects them from here.
    window.consoleWarnings = [];
    for (const level of ['warn', 'error']) {
      const original = console[level].bind(console);
      console[level] = (...args) => {
        window.consoleWarnings.push(args.map((a) => (a && a.stack) || String(a)).join(' '));
        original(...args);
      };
    }
    // Stand-in for the extension APIs the content scripts use.
    window.chrome = {
      runtime: { lastError: undefined, getURL: (p) => '/' + p },
      storage: {
        local: {
          get(keys, cb) {
            const saved = JSON.parse(localStorage.getItem('co-store') || '{}');
            let out;
            if (keys == null) out = saved;
            else if (typeof keys === 'string') out = keys in saved ? { [keys]: saved[keys] } : {};
            else out = { ...keys, ...Object.fromEntries(Object.keys(keys).filter((k) => k in saved).map((k) => [k, saved[k]])) };
            setTimeout(() => cb(out), 0);
          },
          set(patch) {
            const saved = JSON.parse(localStorage.getItem('co-store') || '{}');
            localStorage.setItem('co-store', JSON.stringify({ ...saved, ...patch }));
          },
          remove(keys) {
            const saved = JSON.parse(localStorage.getItem('co-store') || '{}');
            for (const k of [].concat(keys)) delete saved[k];
            localStorage.setItem('co-store', JSON.stringify(saved));
          },
        },
      },
    };
  </script>
  <!-- In the real extension this runs in the page ("MAIN") world. -->
  <script src="/src/page-bridge.js"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button data-nav="/chat/aaaaaaaa-0000-4000-8000-000000000001">Chat A</button>
      <button data-nav="/chat/bbbbbbbb-0000-4000-8000-000000000002">Chat B</button>
      <button data-nav="/new">/new</button>
      <button id="stream">Simulate streaming turn</button>
      <button id="replace">Replace feed node</button>
      <button id="theme">Toggle dark</button>
    </div>
    <div class="scroller" id="scroller"></div>
  </div>

  <script>
    // ---- Fake Claude app -------------------------------------------------
    const params = new URLSearchParams(location.search);
    const VARIANT = params.get('variant') || 'testid';
    const VIRTUAL = params.has('virtual');
    const ESTIMATE = params.has('estimate');
    const CDS = params.has('cds');
    const CODE_QUESTION = '```notebook-python\nmu, sigma = X.mean(0), X.std(0)\nXn = (X - mu) / sigma\n```\nwhat is mu and what is sigma';
    const ESTIMATED_HEIGHT = 300;
    const NONUM = params.has('nonum');
    const turnLabel = (n, m) => (NONUM ? 'Message' : `Message ${n} of ${m}`);
    const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. ';

    function makeQuestions(prefix, n) {
      const qs = [];
      for (let i = 1; i <= n; i++) {
        if (i === 4) qs.push(''); // attachment-only message
        else if (i === 3 && CDS && prefix === 'Alpha') qs.push(CODE_QUESTION);
        else if (i === 7) qs.push(`${prefix} question ${i}: ` + 'a very long question that keeps going '.repeat(5));
        else qs.push(`${prefix} question ${i}:   how do I   handle case #${i}?`);
      }
      return qs;
    }

    const CHATS = {
      'aaaaaaaa-0000-4000-8000-000000000001': { questions: makeQuestions('Alpha', 9), shownTurns: 12 },
      'bbbbbbbb-0000-4000-8000-000000000002': { questions: makeQuestions('Beta', 12), shownTurns: 8 },
    };

    function turnsOf(chat) {
      chat.turnCache = chat.turnCache || [];
      return chat.questions.flatMap((q, i) => {
        if (!chat.turnCache[i] || chat.turnCache[i][0].text !== q) {
          chat.turnCache[i] = [{ role: 'user', text: q }, { role: 'assistant', text: LOREM.repeat(4 + (i % 5) * 3) }];
        }
        return chat.turnCache[i];
      });
    }

    // claude.ai's current markup: a row wrapper around a div[role=article].
    function cdsTurn(a, n, m) {
      const div = document.createElement('div');
      div.className = a.className;
      div.setAttribute('role', 'article');
      div.setAttribute('aria-label', a.getAttribute('aria-label'));
      div.setAttribute('aria-posinset', String(n));
      div.setAttribute('aria-setsize', String(m));
      div.append(...a.childNodes);
      const row = document.createElement('div');
      row.setAttribute('data-testid', 'transcript-row');
      row.setAttribute('data-index', String(n - 1));
      row.append(div);
      return row;
    }

    // A message like "```lang\ncode\n```\ntext" renders as <pre><code> + <p>,
    // and its "You said:" heading only carries the text part.
    function renderBody(body, text) {
      const m = /^```[^\n]*\n([\s\S]*?)\n```\n?([\s\S]*)$/.exec(text);
      if (!m) return (body.textContent = text), text;
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = m[1];
      pre.append(code);
      const p = document.createElement('p');
      p.textContent = m[2];
      body.append(pre, p);
      return m[2];
    }

    function userArticle(text, n, m) {
      const a = document.createElement('article');
      a.className = 'user';
      a.setAttribute('aria-label', turnLabel(n, m));
      const h = document.createElement('h2');
      h.className = 'sr-only';
      const body = document.createElement('div');
      if (VARIANT === 'testid') {
        body.setAttribute('data-testid', 'user-message');
        body.className = 'font-user-message';
      }
      const said = renderBody(body, text);
      h.textContent = VARIANT === 'broken' ? 'Human message' : `You said: ${said}`;
      if (!text) body.append(Object.assign(document.createElement('img'), { alt: '', width: 40, height: 40 }));
      const actions = document.createElement('button');
      actions.textContent = 'Edit';
      a.append(h, body, actions);
      return a;
    }

    function assistantArticle(text, n, m) {
      const a = document.createElement('article');
      a.className = 'assistant';
      a.setAttribute('aria-label', turnLabel(n, m));
      const h = document.createElement('h2');
      h.className = 'sr-only';
      h.textContent = 'Claude responded:';
      const p = document.createElement('p');
      p.textContent = text;
      a.append(h, p);
      return a;
    }

    let feed = null;
    let loading = false;

    function currentChat() {
      const m = location.pathname.match(/^\/chat\/([\w-]+)/);
      return m ? CHATS[m[1]] : null;
    }

    function newFeed() {
      const f = document.createElement('div');
      f.setAttribute('role', 'feed');
      f.setAttribute('aria-label', 'Chat messages');
      return f;
    }

    function turnNode(t, n, m) {
      let node = t.role === 'user' ? userArticle(t.text, n, m) : assistantArticle(t.text, n, m);
      if (CDS) node = cdsTurn(node, n, m);
      node._turn = { t, n, m };
      return node;
    }

    // Virtualization, as claude.ai does it: turns further than one screen
    // from the viewport are unmounted and replaced by a placeholder of the
    // same height; scrolling back re-creates them as NEW nodes (like React).
    function virtualize() {
      if (!VIRTUAL || !feed || !feed.isConnected) return;
      const sc = document.getElementById('scroller');
      const box = sc.getBoundingClientRect();
      const keepTop = box.top - sc.clientHeight;
      const keepBottom = box.bottom + sc.clientHeight;
      for (const el of Array.from(feed.children)) {
        if (!el._turn) continue;
        const r = el.getBoundingClientRect();
        const near = r.bottom >= keepTop && r.top <= keepBottom;
        const isPlaceholder = el.classList.contains('placeholder');
        if (!isPlaceholder && !near) {
          el._turn.t.measured = r.height;
          el.replaceWith(placeholder(el._turn));
        } else if (isPlaceholder && near) {
          el.replaceWith(turnNode(el._turn.t, el._turn.n, el._turn.m));
        }
      }
    }
    function placeholder(turn) {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.style.height = (turn.t.measured || ESTIMATED_HEIGHT) + 'px';
      ph._turn = turn;
      return ph;
    }
    let virtualFrame = 0;
    function scheduleVirtualize() {
      if (!VIRTUAL || virtualFrame) return;
      virtualFrame = requestAnimationFrame(() => { virtualFrame = 0; virtualize(); });
    }

    function loadButton() {
      const btn = document.createElement('button');
      btn.textContent = 'Load earlier messages';
      btn.onclick = loadEarlier;
      return btn;
    }

    // Full render, only on navigation (a new conversation).
    function renderFeed() {
      const chat = currentChat();
      const scroller = document.getElementById('scroller');
      if (!chat) { scroller.replaceChildren(); feed = null; return; }
      // A navigation remounts the chat, so the feed is a new node.
      feed = newFeed();
      scroller.replaceChildren(feed);
      const turns = turnsOf(chat);
      const start = turns.length - chat.shownTurns;
      const nodes = turns.slice(start).map((t, i) => {
        const turn = { t, n: start + i + 1, m: turns.length };
        // Estimated heights: only the last few turns start rendered.
        return VIRTUAL && ESTIMATE && start + i < turns.length - 4 ? placeholder(turn) : turnNode(t, turn.n, turn.m);
      });
      feed.replaceChildren(...(start > 0 ? [loadButton()] : []), ...nodes);
      // Start scrolled to the bottom, like a real chat.
      scroller.scrollTop = scroller.scrollHeight;
      virtualize();
    }

    // Each click injects 3 more turns above the existing ones after a fake
    // network delay, keeping existing nodes (as React would). The scroller has
    // overflow-anchor: none, so the view jumps unless the extension restores it.
    function loadEarlier(e) {
      if (loading) return;
      loading = true;
      const btn = e.currentTarget;
      btn.textContent = 'Loading…';
      const chat = currentChat();
      setTimeout(() => {
        loading = false;
        const turns = turnsOf(chat);
        const oldStart = turns.length - chat.shownTurns;
        chat.shownTurns = Math.min(turns.length, chat.shownTurns + 3);
        const start = turns.length - chat.shownTurns;
        const nodes = turns.slice(start, oldStart).map((t, i) =>
          VIRTUAL && ESTIMATE ? placeholder({ t, n: start + i + 1, m: turns.length }) : turnNode(t, start + i + 1, turns.length)
        );
        btn.after(...nodes);
        if (start > 0) btn.textContent = 'Load earlier messages';
        else btn.remove();
        virtualize();
      }, 250);
    }

    function navigate(path) {
      history.pushState({}, '', path + location.search);
      renderFeed();
    }

    // Appends a user turn, then grows an assistant turn every 20ms for 3s.
    function stream(question = 'Streaming question about observers') {
      const chat = currentChat();
      chat.questions.push(question);
      chat.shownTurns += 2;
      const m = chat.questions.length * 2;
      feed.append(turnNode({ role: 'user', text: question }, m - 1, m));
      const answer = turnNode({ role: 'assistant', text: '' }, m, m);
      feed.append(answer);
      virtualize();
      const p = answer.querySelector('p');
      const started = performance.now();
      return new Promise((resolve) => {
        const tick = setInterval(() => {
          const span = document.createElement('span');
          span.textContent = 'token ';
          p.append(span);
          if (performance.now() - started > 3000) { clearInterval(tick); resolve(); }
        }, 20);
      });
    }

    function replaceFeed() {
      const old = feed;
      feed = newFeed();
      feed.append(...old.childNodes);
      old.replaceWith(feed);
    }

    // ---- Fake claude.ai API (?api=1) -----------------------------------
    // GET /api/organizations and /api/organizations/<org>/chat_conversations/<id>.
    // Returns every message of the chat (also ones not loaded in the page) as
    // a tree with an abandoned branch (an edited first question) that must
    // not appear in the outline.
    window.apiCalls = 0;
    if (params.has('api')) {
      document.cookie = 'lastActiveOrg=org-1; path=/';
      const realFetch = window.fetch.bind(window);
      const json = (data) => new Response(JSON.stringify(data), { headers: { 'content-type': 'application/json' } });
      const conversation = (chat) => {
        const messages = [];
        let parent = '00000000-0000-4000-8000-000000000000';
        chat.questions.forEach((q, i) => {
          if (i === 0) {
            messages.push({ uuid: 'old-edit', parent_message_uuid: parent, sender: 'human', index: 0, content: [{ type: 'text', text: 'An old version of the first question' }] });
          }
          const h = { uuid: `h${i}`, parent_message_uuid: parent, sender: 'human', index: 2 * i, content: q ? [{ type: 'text', text: q }, { type: 'tool_use' }] : [], text: q };
          const a = { uuid: `a${i}`, parent_message_uuid: h.uuid, sender: 'assistant', index: 2 * i + 1, content: [{ type: 'text', text: 'answer' }] };
          messages.push(h, a);
          parent = a.uuid;
        });
        return { uuid: 'x', chat_messages: messages, current_leaf_message_uuid: parent };
      };
      window.fetch = async (url, opts) => {
        const u = new URL(url, location.href);
        if (u.pathname === '/api/organizations') return json([{ uuid: 'org-1' }]);
        const m = u.pathname.match(/^\/api\/organizations\/org-1\/chat_conversations\/([\w-]+)$/);
        if (m) {
          window.apiCalls++;
          const chat = CHATS[m[1]];
          await new Promise((r) => setTimeout(r, 100));
          return chat ? json(conversation(chat)) : new Response('', { status: 404 });
        }
        return realFetch(url, opts);
      };
    }

    document.querySelectorAll('[data-nav]').forEach((b) => (b.onclick = () => navigate(b.dataset.nav)));
    document.getElementById('stream').onclick = () => stream();
    document.getElementById('replace').onclick = replaceFeed;
    document.getElementById('theme').onclick = () => document.documentElement.classList.toggle('dark');
    window.addEventListener('popstate', renderFeed);
    document.getElementById('scroller').addEventListener('scroll', scheduleVirtualize, { passive: true });
    renderFeed();

    window.fixture = { CHATS, navigate, stream, replaceFeed, get feed() { return feed; } };
  </script>

  <!-- Content scripts, in manifest order. -->
  <script src="/src/selectors.js"></script>
  <script src="/src/sources.js"></script>
  <script src="/src/outline.js"></script>
  <script src="/src/panel.js"></script>
  <script src="/src/main.js"></script>
  <script>
    if (params.has('selftest')) {
      const s = document.createElement('script');
      s.src = '/test/selftest.js';
      document.body.append(s);
    }
  </script>
</body>
</html>
